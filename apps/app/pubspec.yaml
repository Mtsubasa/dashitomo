name: dashitomo
description: "「一緒に食べて、いつか見送る」体験を届ける、キャラクターと過ごす食事記録アプリ。"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.1

dependencies:
  dio: ^5.10.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  freezed_annotation: ^3.1.0
  go_router: ^17.3.0
  json_annotation: ^4.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: 2.15.1
  freezed: 3.2.5
  json_serializable: ^6.14.0

flutter:
  uses-material-design: true
